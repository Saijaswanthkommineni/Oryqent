[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["**/migrations/*.py", ".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B904"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
